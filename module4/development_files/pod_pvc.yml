apiVersion: v1
kind: Pod
metadata:
  name: pod-name-sso
spec:
  containers:
  - name: pod-name-sso                # Replace this with your SSO
    image: ubuntu:20.04
    command: ["sh", "-c", "echo 'Im a new pod' && sleep infinity"]
    resources:
      limits:
        memory: 12Gi
        cpu: 2
      requests:
        memory: 10Gi
        cpu: 2
    volumeMounts:
    - mountPath: /data
      name: persistentVolume-name     # Replace this with your PVC name
  volumes:
    - name: persistentVolume-name     # Replace this with your PVC name
      persistentVolumeClaim:
        claimName: persistentVolume-name