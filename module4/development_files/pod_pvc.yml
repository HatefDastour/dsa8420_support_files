apiVersion: v1
kind: Pod
metadata:
  name: <YOUR-SSO>-pod                # Replace <YOUR-SSO> with your SSO (e.g., hdtg3-pod)
spec:
  containers:
  - name: <YOUR-SSO>-container        # Replace <YOUR-SSO> with your SSO
    image: ubuntu:20.04
    command: ["sh", "-c", "echo 'Im a new pod' && sleep infinity"]
    resources:
      limits:
        memory: 12Gi
        cpu: 2
      requests:
        memory: 10Gi
        cpu: 2
    volumeMounts:
    - mountPath: /data
      name: pod-storage               # Internal reference (must match volumes[].name below)
  volumes:
    - name: pod-storage               # Internal reference (must match volumeMounts[].name above)
      persistentVolumeClaim:
        claimName: <YOUR-PVC-NAME>    # Replace with the exact PVC name created in persistent_volume.yml (e.g., hdtg3-pv)