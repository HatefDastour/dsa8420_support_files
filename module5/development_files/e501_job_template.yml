# Exercise 5.01 - GPU Job template that trains ONE network
# Do not edit this file by hand. The sed command in the notebook fills in the placeholders
# (your SSO, the network name, and the lowercase network name) and writes one YAML per network.
apiVersion: batch/v1
kind: Job
metadata:
  name: job-<your-sso>-<network-lower>-train
spec:
  template:
    spec:
      automountServiceAccountToken: false
      containers:
      - name: job-<your-sso>-<network-lower>-train
        image: gitlab-registry.nrp-nautilus.io/skhan/dl_pytorch:4bd8b3be
        tty: true
        stdin: true
        workingDir: /data
        command: ["/bin/sh","-c"]
        args:
        - python3 main.py --net <network>;
        volumeMounts:
        - name: <your-sso>-pv-new
          mountPath: /data
        resources:
          limits:
            memory: 20Gi
            cpu: 2
            nvidia.com/gpu: 1
          requests:
            memory: 20Gi
            cpu: 2
            nvidia.com/gpu: 1
      volumes:
      - name: <your-sso>-pv-new
        persistentVolumeClaim:
          claimName: <your-sso>-pv-new
      restartPolicy: Never
  backoffLimit: 0
